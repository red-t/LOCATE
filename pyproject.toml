[build-system]
requires = ["setuptools>=45", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LOCATE"
version = "1.0.0"
description = "LOCATE - Long-read read Alignment and Clustering for Transcriptome Analysis"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "numpy>=1.21",
    "pandas>=1.3",
    "autogluon.tabular>=1.0",
    "setuptools<70",
]

[project.scripts]
locate = "LOCATE.Main:main"